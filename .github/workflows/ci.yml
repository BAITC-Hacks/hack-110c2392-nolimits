name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend and acceptance tests
        run: python -m pytest -q backend/tests qa
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build Docker images
        run: docker compose build
      - name: Start application
        run: docker compose up -d
      - name: Smoke test
        run: |
          curl --fail --retry 18 --retry-delay 5 --retry-connrefused http://localhost:8000/health
          curl --fail --retry 18 --retry-delay 5 --retry-connrefused http://localhost:5173/
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop application
        if: always()
        run: docker compose down
